<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Dashboard</title>
<style>
  :root { --bg:#f3f4f6; --surface:#fff; --surface2:#f8f9fb; --border:#dfe3e8; --text:#15181d; --muted:#657080; --waiting:#b96900; --running:#2364dc; --idle:#167b54; --error:#c0342c; --stale:#8a6918; --unmonitorable:#6a7280; --data_error:#a83d76; --healthy:#16875a; --clock_skew:#8a3ea1; }
  @media (prefers-color-scheme:dark) { :root { --bg:#0e1014; --surface:#181b21; --surface2:#20242c; --border:#303641; --text:#edf0f4; --muted:#aeb6c1; --waiting:#f5a524; --running:#72aaff; --idle:#48bd89; --error:#ff7c75; --stale:#e4bd4f; --unmonitorable:#9ca4b1; --data_error:#ef86bb; --healthy:#4ac891; --clock_skew:#d98bf1; } }
  * { box-sizing:border-box; } body { margin:0; padding:20px 24px 40px; background:var(--bg); color:var(--text); font:14px/1.5 "Segoe UI Variable Text","Segoe UI","Yu Gothic UI",Meiryo,sans-serif; } body.display-stale main,body.display-stale .attention { opacity:.58; } button,input { font:inherit; } button { color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:6px 10px; cursor:pointer; } button:hover { border-color:var(--running); } button.active { color:#fff; background:var(--running); border-color:var(--running); } button.primary { color:#fff; background:var(--running); border-color:var(--running); }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; } h1 { margin:0 8px 0 0; font-size:20px; } .stats { display:flex; gap:8px; flex-wrap:wrap; } .stat { display:flex; align-items:baseline; gap:6px; padding:4px 9px; border-radius:8px; background:var(--surface); border:1px solid var(--border); } .stat b { color:var(--c); font-size:18px; line-height:1; } .stat span,.updated { color:var(--muted); font-size:12px; } .updated { margin-left:auto; } .updated.error { color:var(--error); } .top-actions { display:flex; gap:6px; }
  .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 10px; } .filters,.tools { display:flex; gap:4px; flex-wrap:wrap; } .filters button { padding:4px 8px; font-size:12px; } .tools label,.notify { color:var(--muted); font-size:12px; white-space:nowrap; } .search { min-width:180px; max-width:280px; flex:1; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:6px 8px; } .filter-count { color:var(--muted); font-size:12px; }
  .fetch-status { color:var(--muted); font-size:12px; min-height:1.5em; margin-bottom:12px; } .fetch-status.error { color:var(--error); font-weight:600; }
  .attention { margin:0 0 20px; } .attention h2 { color:var(--error); font-size:14px; margin:0 0 8px; } .attention-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:8px; } .notice { text-align:left; border-left:4px solid var(--c); padding:8px 10px; min-height:62px; } .notice b,.notice span { display:block; } .notice b { font-size:12px; } .notice span { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hosts { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; align-items:start; } .host { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; } .host-head { display:flex; align-items:flex-start; gap:7px; padding:10px 11px; border-bottom:1px solid var(--border); } .host-head h2 { font-size:15px; margin:0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .host-id { color:var(--muted); font-size:10px; } .badge { color:var(--c); font-size:11px; font-weight:700; white-space:nowrap; } .host-time { margin-left:auto; color:var(--muted); font-size:10px; white-space:nowrap; } .tool { display:inline-block; color:var(--muted); border:1px solid var(--border); border-radius:4px; padding:0 4px; font-size:10px; } .tool.on { color:var(--t); border-color:var(--t); } .tool.missing { color:var(--error); border-color:var(--error); } .sessions { padding:9px; display:flex; flex-direction:column; gap:7px; } .card { width:100%; text-align:left; border-left:4px solid var(--c); padding:8px; } .card:hover { background:var(--surface2); } .card-top { display:flex; align-items:center; gap:6px; } .state { color:var(--c); font-size:11px; font-weight:700; } .age,.session-id { color:var(--muted); font-size:10px; } .session-id { margin-left:auto; } .project { font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .branch,.activity { color:var(--muted); font:11px "Cascadia Mono",Consolas,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .empty,.nodata { color:var(--muted); font-size:12px; } .empty { padding:4px; } .nodata { text-align:center; padding:44px 16px; } .compact .card { padding:5px 7px; } .compact .branch { display:none; }
  dialog { color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:0 12px 40px #0008; max-width:620px; width:calc(100% - 28px); padding:20px; } dialog::backdrop { background:#0008; } dialog h2 { margin:0 0 10px; font-size:17px; } dialog p,.hint { color:var(--muted); font-size:12px; } dialog label { display:block; font-size:12px; font-weight:700; margin:10px 0 4px; } dialog input[type=text] { width:100%; color:var(--text); background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:7px; } .row { display:flex; gap:7px; } .row input { flex:1; } .dialog-actions { display:flex; justify-content:flex-end; gap:7px; margin-top:16px; } .message { min-height:1.5em; color:var(--error); font-size:12px; margin-top:8px; } .preview { color:var(--muted); font-size:12px; margin-top:8px; } .detail-grid { display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:13px; } .detail-grid dt { color:var(--muted); } .detail-grid dd { margin:0; overflow-wrap:anywhere; } .host-names { margin-top:12px; max-height:180px; overflow:auto; } .host-name { display:grid; grid-template-columns:160px 1fr; gap:7px; align-items:center; margin:6px 0; font-size:12px; }
  @media (max-width:640px) { body { padding:14px; } .updated { margin-left:0; } .host-names { max-height:130px; } .host-name { grid-template-columns:1fr; gap:2px; } }
</style>
</head>
<body>
<header><h1>Agent Dashboard</h1><div class="stats" id="stats"></div><span class="updated" id="updated"></span><div class="top-actions"><button id="refresh" type="button">再読込</button><button id="open-settings" type="button">設定</button></div></header>
<section class="controls"><div class="filters" id="filters"></div><input class="search" id="search" type="search" placeholder="PC / project / branch を検索"><div class="tools"><label><input id="tool-claude" type="checkbox" checked> Claude</label><label><input id="tool-codex" type="checkbox" checked> Codex</label><label class="notify"><input id="notifications" type="checkbox"> 新規の承認待ち・エラーを通知</label><button id="duration" type="button">経過: 非表示</button><button id="density" type="button">密度: 標準</button></div><span class="filter-count" id="filter-count"></span></section>
<div class="fetch-status" id="fetch-status"></div>
<section class="attention" id="attention"></section>
<main class="hosts" id="hosts"></main>
<dialog id="detail-dialog"><h2 id="detail-title"></h2><dl class="detail-grid" id="detail"></dl><div class="dialog-actions"><button id="close-detail" type="button">閉じる</button></div></dialog>
<dialog id="settings-dialog"><form id="settings-form"><h2>設定</h2><p><b>閲覧 PC:</b> この画面で OneDrive と同期済みの起点フォルダを指定します。<br><b>監視対象 PC:</b> OneDrive 同期後に配布済みの <code>install.ps1</code> を実行し、Codex は <code>/hooks</code> で trust を確認します。</p><label for="root-dir">起点フォルダ</label><div class="row"><input id="root-dir" name="root_dir" type="text" autocomplete="off" required><button id="pick-folder" type="button">選択</button><button id="preview-root" type="button">確認</button></div><div class="preview" id="root-preview"></div><div class="host-names" id="host-names"></div><div class="message" id="setting-error" role="alert"></div><div class="dialog-actions"><button id="cancel-settings" type="button">キャンセル</button><button class="primary" type="submit">保存</button></div></form></dialog>
<script>
const LABEL={waiting:'承認待ち',running:'実行中',idle:'入力待ち',error:'エラー',stale:'状態不明',ended:'終了',healthy:'正常',heartbeat_delayed:'heartbeat 遅延',unmonitorable:'監視不能',data_error:'データ異常',clock_skew:'時計ずれ'};
const ACTIVITY={tool_running:'ツール実行中',tool_failed:'ツール失敗（継続中）',tool_interrupted:'ツール中断（継続中）',approval_pending:'承認待ち',approval_denied:'承認拒否（継続中）',turn_failed:'応答エラーで終了',interrupted:'中断'};
const FAILURE={rate_limit:'レート制限',overloaded:'サービス混雑',authentication_failed:'認証失敗',oauth_org_not_allowed:'組織アクセス拒否',account_on_hold:'アカウント保留',billing_error:'課金エラー',invalid_request:'無効なリクエスト',model_not_found:'モデル未検出',server_error:'サーバーエラー',max_output_tokens:'出力上限',cloud_credential_error:'クラウド資格情報エラー',unknown:'API エラー'};
const FILTERS=[['all','全件'],['attention','要確認'],['running','稼働中'],['idle','入力待ち'],['unmonitorable','監視不能']];
const preferenceKey='agent-dashboard-preferences';
const preferences=Object.assign({filter:'all',query:'',claude:true,codex:true,notifications:false,density:'normal',showDuration:false},JSON.parse(localStorage.getItem(preferenceKey)||'{}'));
let data=null, timer=null, delay=5000, inFlight=false, seenNoticeKeys=new Set(), initializedNotices=false, lastSuccess=null, lastAttempt=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stamp=value=>new Date(value).toLocaleString();
const age=value=>{const seconds=Math.max(0,(Date.now()-Date.parse(value))/1000);return seconds<60?`${seconds|0}秒`:seconds<3600?`${seconds/60|0}分`:`${seconds/3600|0}時間`;};
const savePreferences=()=>localStorage.setItem(preferenceKey,JSON.stringify(preferences));
const fetchJson=async(url,options)=>{const response=await fetch(url,options);let value;try{value=await response.json()}catch{throw new Error('サーバーの応答を読めませんでした。')}if(!response.ok)throw new Error(value.error||`通信エラー (${response.status})`);return value;};
function notices(value){const items=[];for(const s of value.sessions){if(s.state==='waiting')items.push({id:`waiting:${s.host_id}:${s.tool}:${s.session}`,event:`${s.updated_at}:waiting`,priority:0,time:s.updated_at,color:'waiting',title:`${s.pc} / ${s.project||projectLabel(s)} — 承認待ち`,detail:'対応が必要です',session:s});else if(s.state==='error')items.push({id:`error:${s.host_id}:${s.tool}:${s.session}`,event:`${s.updated_at}:error`,priority:1,time:s.updated_at,color:'error',title:`${s.pc} / ${s.project||projectLabel(s)} — エラー`,detail:FAILURE[s.failure_reason]||ACTIVITY[s.activity]||'turn エラー',session:s});}for(const h of value.hosts){if(h.health==='unmonitorable')items.push({id:`health:${h.id}`,event:`${h.last_heartbeat_at}:unmonitorable`,priority:2,time:h.last_heartbeat_at,color:'unmonitorable',title:`${h.display_name} — 監視不能`,detail:'PC停止・ログオフ・task失敗・OneDrive停止の可能性があります'});else if(h.health==='heartbeat_delayed')items.push({id:`health:${h.id}`,event:`${h.last_heartbeat_at}:delayed`,priority:3,time:h.last_heartbeat_at,color:'heartbeat_delayed',title:`${h.display_name} — heartbeat 遅延`,detail:`最終 heartbeat: ${age(h.last_heartbeat_at)}前`});if(h.data_errors.length)items.push({id:`data:${h.id}`,event:`${h.data_errors.join(',')}:${h.last_heartbeat_at}`,priority:4,time:h.last_heartbeat_at||'',color:'data_error',title:`${h.display_name} — データ異常`,detail:h.data_errors.join(', ')});for(const [tool,status] of Object.entries(h.tools)){if(!status.configured)items.push({id:`hook:${h.id}:${tool}`,event:`${h.last_heartbeat_at}:hook`,priority:5,time:h.last_heartbeat_at,color:'error',title:`${h.display_name} — ${tool==='claude'?'Claude':'Codex'} hook 未設定`,detail:'監視対象 PC で install.ps1 を再実行してください'});}}return items.sort((a,b)=>a.priority-b.priority||Date.parse(b.time||0)-Date.parse(a.time||0));}
function projectLabel(s){return s.project_status==='cwd_missing'?'作業フォルダ未取得':s.project_status==='cwd_root'?'ドライブ直下':s.project_status==='cwd_error'?'作業フォルダ取得エラー':'プロジェクト不明';}
function branchLabel(s){return s.branch||({detached:'detached HEAD',non_git:'git 管理外',unavailable:'branch 未取得'}[s.branch_status]||'未取得');}
function selectedTools(s){return preferences[s.tool];}
function matches(s,h){const query=preferences.query.toLowerCase();if(!selectedTools(s))return false;if(!query)return true;return [h.display_name,h.pc,h.user,s.project,s.branch,s.project_id].some(v=>String(v||'').toLowerCase().includes(query));}
function visibleHosts(){if(!data)return[];return data.hosts.filter(h=>{const sessions=data.sessions.filter(s=>s.host_id===h.id&&matches(s,h));if(preferences.filter==='attention')return sessions.some(s=>s.state==='waiting'||s.state==='error')||h.health!=='healthy'||h.data_errors.length||Object.values(h.tools).some(t=>!t.configured);if(preferences.filter==='running')return sessions.some(s=>s.state==='running');if(preferences.filter==='idle')return sessions.some(s=>s.state==='idle');if(preferences.filter==='unmonitorable')return h.health==='unmonitorable';return !preferences.query||sessions.length||[h.display_name,h.pc,h.user].some(v=>String(v||'').toLowerCase().includes(preferences.query.toLowerCase()));});}
function stateColor(s){return s==='healthy'?'healthy':s;}
function sessionCard(s){return `<button class="card" data-session="${esc(`${s.host_id}|${s.tool}|${s.session}`)}" style="--c:var(--${esc(s.state)})" title="詳細を表示"><div class="card-top"><span class="state">${esc(LABEL[s.state]||s.state)}</span><span class="age" title="${esc(stamp(s.updated_at))}">${age(s.updated_at)}前</span><span class="tool" style="--t:var(--${s.tool})">${s.tool==='claude'?'Claude':'Codex'}</span><span class="session-id">#${esc(s.session)}</span></div><div class="project">${esc(s.project||projectLabel(s))}</div><div class="branch">${esc(branchLabel(s))}</div>${preferences.showDuration?`<div class="age">開始から ${age(s.started_at)}</div>`:''}${s.activity?`<div class="activity">${esc(ACTIVITY[s.activity]||s.activity)}</div>`:''}</button>`;}
function hostScore(h){const sessions=data.sessions.filter(s=>s.host_id===h.id);if(sessions.some(s=>s.state==='waiting'))return 0;if(sessions.some(s=>s.state==='error'))return 1;if(sessions.some(s=>s.state==='running'))return 2;if(sessions.some(s=>s.state==='idle'))return 3;if(h.health==='unmonitorable')return 4;return 5;}
function render(){if(!data)return;document.body.classList.toggle('compact',preferences.density==='compact');const live=data.sessions.filter(s=>s.state!=='ended'), count=state=>live.filter(s=>s.state===state).length, offline=data.hosts.filter(h=>h.health==='unmonitorable').length;document.getElementById('stats').innerHTML=[['waiting','承認待ち',count('waiting')],['error','エラー',count('error')],['running','実行中',count('running')],['unmonitorable','監視不能',offline]].map(([color,label,value])=>`<div class="stat" style="--c:var(--${color})"><b>${value}</b><span>${label}</span></div>`).join('');document.title=`承認待ち ${count('waiting')} / エラー ${count('error')} — Agent Dashboard`;const alertItems=notices(data);document.getElementById('attention').innerHTML=alertItems.length?`<h2>要確認（${alertItems.length}）</h2><div class="attention-list">${alertItems.map(item=>`<button class="notice" data-session="${item.session?esc(`${item.session.host_id}|${item.session.tool}|${item.session.session}`):''}" style="--c:var(--${item.color})"><b>${esc(item.title)}</b><span>${esc(item.detail)}</span></button>`).join('')}</div>`:'';const hosts=visibleHosts().sort((a,b)=>hostScore(a)-hostScore(b)||a.display_name.localeCompare(b.display_name,'ja'));document.getElementById('filter-count').textContent=`${hosts.length} / ${data.hosts.length} PC、${live.filter(s=>hosts.some(h=>h.id===s.host_id)&&matches(s,hosts.find(h=>h.id===s.host_id))).length} / ${live.length} session`;let empty='';if(data.source_error)empty=`<div class="nodata">${esc(data.source_error)}</div>`;else if(!data.hosts.length)empty='<div class="nodata">監視データはまだありません。上の「設定」で閲覧 PC の起点フォルダを確認し、監視対象 PC で install.ps1 を実行してください。</div>';else if(!data.sessions.length)empty='<div class="nodata">端末は検出されていますが、セッションはありません。</div>';document.getElementById('hosts').innerHTML=empty||hosts.map(h=>{const sessions=data.sessions.filter(s=>s.host_id===h.id&&s.state!=='ended'&&matches(s,h)).sort((a,b)=>({waiting:0,error:1,running:2,idle:3,stale:4}[a.state]??9)-({waiting:0,error:1,running:2,idle:3,stale:4}[b.state]??9));const tools=['claude','codex'].map(tool=>{const status=h.tools[tool];return `<span class="tool ${status.configured?'on':'missing'}" style="--t:var(--${tool})" title="${status.trust==='unverified'?'設定あり・動作未確認':'hook 未設定'}">${tool==='claude'?'Claude':'Codex'}</span>`;}).join(' ');return `<section class="host"><div class="host-head"><div><span class="badge" style="--c:var(--${stateColor(h.health)})">${esc(LABEL[h.health]||h.health)}</span><h2>${esc(h.display_name)}</h2><div class="host-id">${esc(h.pc)} / ${esc(h.user)} · ${esc(h.id)}</div>${tools}</div><span class="host-time" title="${h.last_heartbeat_at?esc(stamp(h.last_heartbeat_at)):''}">heartbeat ${h.last_heartbeat_at?`${age(h.last_heartbeat_at)}前`:'未取得'}</span></div><div class="sessions">${sessions.map(sessionCard).join('')||'<div class="empty">条件に合うアクティブなセッションはありません</div>'}</div></section>`;}).join('');document.querySelectorAll('[data-session]').forEach(el=>el.addEventListener('click',()=>el.dataset.session&&openDetail(el.dataset.session)));notifyNew(alertItems);}
function openDetail(key){const [hostId,tool,session]=key.split('|'),s=data.sessions.find(value=>value.host_id===hostId&&value.tool===tool&&value.session===session),h=data.hosts.find(value=>value.id===hostId);if(!s||!h)return;document.getElementById('detail-title').textContent=`${h.display_name} / ${s.project||projectLabel(s)}`;const staleAt=s.state_reason==='session_stale'?stamp(new Date(Date.parse(s.updated_at)+5*60000)):null;const rows=[['状態',LABEL[s.state]||s.state],['理由',s.state_reason==='host_health'?'端末の監視状態を確認できません':s.state_reason==='clock_skew'?'端末の時計が未来です':s.state_reason==='session_stale'?'session の更新が5分以上ありません':FAILURE[s.failure_reason]||ACTIVITY[s.activity]||'—'],['最終更新',stamp(s.updated_at)],['開始',`${stamp(s.started_at)}（経過 ${age(s.started_at)}）`],...(staleAt?[['状態不明化',staleAt]]:[]),['端末',`${h.pc} / ${h.user}`],['tool',s.tool==='claude'?'Claude Code':'Codex'],['session',`#${s.session}`],['project',s.project||projectLabel(s)],['識別子',s.project_id||'—'],['branch',branchLabel(s)],['heartbeat',h.last_heartbeat_at?stamp(h.last_heartbeat_at):'未取得'],['最後の hook',h.last_hook_at?stamp(h.last_hook_at):'未取得']];document.getElementById('detail').innerHTML=rows.map(([label,value])=>`<dt>${esc(label)}</dt><dd>${esc(value)}</dd>`).join('');document.getElementById('detail-dialog').showModal();}
function notifyNew(items){const enabled=preferences.notifications&&'Notification' in window;if(!initializedNotices){items.forEach(item=>seenNoticeKeys.add(`${item.id}:${item.event}`));initializedNotices=true;return;}for(const item of items){const key=`${item.id}:${item.event}`;if(seenNoticeKeys.has(key))continue;seenNoticeKeys.add(key);if(enabled&&item.priority<=1&&Notification.permission==='granted')new Notification('Agent Dashboard',{body:item.title});}}
function renderFilters(){document.getElementById('filters').innerHTML=FILTERS.map(([id,label])=>`<button class="${preferences.filter===id?'active':''}" data-filter="${id}" type="button">${label}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{preferences.filter=button.dataset.filter;savePreferences();renderFilters();render();}));}
function schedule(){clearTimeout(timer);timer=setTimeout(refresh,delay);}
async function refresh(){if(inFlight)return;inFlight=true;lastAttempt=new Date();try{data=await fetchJson('/api/dashboard');lastSuccess=new Date();delay=5000;document.body.classList.remove('display-stale');const skew=Math.abs(Date.now()-Date.parse(data.generated_at));document.getElementById('fetch-status').className=skew>60000?'fetch-status error':'fetch-status';document.getElementById('fetch-status').textContent=skew>60000?'閲覧 PC とサーバーの時計が1分以上ずれています。状態時刻を確認してください。':'';render();}catch(error){delay=Math.min(delay*2,30000);document.body.classList.add('display-stale');document.getElementById('fetch-status').className='fetch-status error';document.getElementById('fetch-status').textContent=`取得失敗（${lastSuccess?lastSuccess.toLocaleTimeString()+' に成功':'未取得'}）。表示は古い可能性があります: ${error.message}`;}finally{inFlight=false;document.getElementById('updated').textContent=`最終成功: ${lastSuccess?lastSuccess.toLocaleTimeString():'—'} / 最終試行: ${lastAttempt.toLocaleTimeString()}`;schedule();}}
const settings=document.getElementById('settings-dialog'),rootDir=document.getElementById('root-dir'),settingError=document.getElementById('setting-error'),rootPreview=document.getElementById('root-preview');
function renderHostNames(names={}){document.getElementById('host-names').innerHTML=data?.hosts.length?`<label>PC 表示名</label>${data.hosts.map(h=>`<div class="host-name"><span>${esc(h.pc)} / ${esc(h.user)}</span><input type="text" data-host-name="${esc(h.id)}" maxlength="64" value="${esc(names[h.id]||h.display_name)}"></div>`).join('')}`:'';}
async function previewRoot(){const result=await fetchJson('/api/settings/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({root_dir:rootDir.value})});rootPreview.textContent=result.valid?`検出: ${result.hosts} PC / 読取エラー: ${result.data_errors}${result.structure_valid?'':'（フォルダ構造が未確認）'}`:result.source_error;return result;}
document.getElementById('open-settings').addEventListener('click',async()=>{settingError.textContent='';rootPreview.textContent='';try{const value=await fetchJson('/api/settings');rootDir.value=value.root_dir||value.default_root_dir||'';renderHostNames(value.host_names);settings.showModal();}catch(error){settingError.textContent=error.message;settings.showModal();}});
document.getElementById('pick-folder').addEventListener('click',async()=>{settingError.textContent='';try{const value=await fetchJson('/api/settings/pick-folder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initial:rootDir.value})});if(value.root_dir)rootDir.value=value.root_dir;}catch(error){settingError.textContent=error.message;}});
document.getElementById('preview-root').addEventListener('click',async()=>{settingError.textContent='';try{await previewRoot();}catch(error){settingError.textContent=error.message;}});
document.getElementById('cancel-settings').addEventListener('click',()=>settings.close());
document.getElementById('settings-form').addEventListener('submit',async event=>{event.preventDefault();settingError.textContent='';try{const preview=await previewRoot();if(!preview.valid||!preview.structure_valid)throw new Error('起点フォルダの構造を確認してください。');const host_names=Object.fromEntries([...document.querySelectorAll('[data-host-name]')].map(input=>[input.dataset.hostName,input.value]));await fetchJson('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({root_dir:rootDir.value,host_names})});data=await fetchJson('/api/dashboard');render();settings.close();}catch(error){settingError.textContent=error.message;}});
document.getElementById('close-detail').addEventListener('click',()=>document.getElementById('detail-dialog').close());document.getElementById('refresh').addEventListener('click',()=>{delay=0;refresh();});document.getElementById('search').value=preferences.query;document.getElementById('search').addEventListener('input',event=>{preferences.query=event.target.value;savePreferences();render();});for(const tool of ['claude','codex']){const input=document.getElementById(`tool-${tool}`);input.checked=preferences[tool];input.addEventListener('change',()=>{preferences[tool]=input.checked;savePreferences();render();});}const notifications=document.getElementById('notifications');notifications.checked=preferences.notifications&&'Notification' in window;notifications.disabled=!('Notification' in window);notifications.addEventListener('change',async()=>{if(!('Notification' in window)){notifications.checked=false;return;}if(notifications.checked&&Notification.permission==='default')await Notification.requestPermission();preferences.notifications=notifications.checked&&Notification.permission==='granted';notifications.checked=preferences.notifications;savePreferences();});const duration=document.getElementById('duration');duration.addEventListener('click',event=>{preferences.showDuration=!preferences.showDuration;event.currentTarget.textContent=`経過: ${preferences.showDuration?'表示':'非表示'}`;savePreferences();render();});duration.textContent=`経過: ${preferences.showDuration?'表示':'非表示'}`;document.getElementById('density').addEventListener('click',event=>{preferences.density=preferences.density==='normal'?'compact':'normal';event.currentTarget.textContent=`密度: ${preferences.density==='normal'?'標準':'コンパクト'}`;savePreferences();render();});document.getElementById('density').textContent=`密度: ${preferences.density==='normal'?'標準':'コンパクト'}`;document.addEventListener('visibilitychange',()=>{if(!document.hidden){delay=0;refresh();}});renderFilters();refresh();
</script>
</body>
</html>
